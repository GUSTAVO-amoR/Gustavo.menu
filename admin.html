<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gustavo — Gestione</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --navy:#0b3d5c; --navy-dark:#082c43; --cream:#fcf3e8; --white:#ffffff;
    --border:#e4e2dd; --text:#1f2d3a; --muted:#7a8794; --danger:#c0392b; --danger-bg:#fdecea;
    --ok:#1e824c; --radius:12px; --shadow:0 4px 18px rgba(11,61,92,.09);
    --serif:Georgia,'Times New Roman',serif; --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--text);font-family:var(--sans);}
  h1,h2,h3{font-family:var(--serif);color:var(--navy);margin:0;}
  button{font-family:var(--sans);cursor:pointer;}
  input,textarea,select{font-family:var(--sans);}
  .hidden{display:none !important;}

  /* ---------- Login ---------- */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  #loginBox{background:var(--white);padding:36px 32px;border-radius:var(--radius);box-shadow:var(--shadow);width:320px;}
  #loginBox h1{font-size:26px;margin-bottom:4px;}
  #loginBox p{color:var(--muted);font-size:13px;margin:0 0 20px;}
  #loginBox input{width:100%;padding:10px 12px;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;}
  #loginBox button{width:100%;padding:11px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-weight:600;font-size:14px;}
  #loginErr{color:var(--danger);font-size:13px;margin-top:8px;min-height:16px;}

  /* ---------- Top bar ---------- */
  #topbar{position:sticky;top:0;z-index:40;background:rgba(252,243,232,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);}
  #topbar-inner{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  #brand{font-size:22px;flex-shrink:0;}
  #brand span{color:var(--muted);font-size:14px;font-family:var(--sans);}
  #tabs{display:flex;gap:6px;}
  .tabbtn{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:#fff;color:var(--navy);font-size:14px;font-weight:600;}
  .tabbtn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  #searchWrap{flex:1;min-width:180px;position:relative;}
  #searchInput{width:100%;padding:9px 14px 9px 34px;border-radius:20px;border:1px solid var(--border);font-size:14px;background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="%237a8794" stroke-width="2"><circle cx="6.5" cy="6.5" r="5.5"/><line x1="10.5" y1="10.5" x2="15" y2="15"/></svg>') no-repeat 10px center;}
  #langs{display:flex;gap:4px;}
  .langbtn{padding:6px 10px;border-radius:14px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:700;color:var(--navy);}
  .langbtn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  #userInfo{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
  #logoutBtn{padding:7px 14px;border-radius:16px;border:1px solid var(--border);background:#fff;font-size:13px;}

  #main{max-width:1180px;margin:0 auto;padding:20px;}

  /* ---------- Piatti layout ---------- */
  #piattiLayout{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start;}
  #catNav{position:sticky;top:82px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:10px;max-height:calc(100vh - 100px);overflow:auto;}
  #catNav a{display:block;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:13px;font-weight:600;margin-bottom:2px;}
  #catNav a:hover{background:var(--cream);}
  #catNav .subnavlink{font-weight:400;font-size:12px;padding-left:20px;color:var(--muted);}

  details.catAcc{background:#fff;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;scroll-margin-top:80px;}
  details.catAcc>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;font-family:var(--serif);font-size:19px;color:var(--navy);}
  details.catAcc>summary::-webkit-details-marker{display:none;}
  details.catAcc>summary .count{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:600;}
  .catBody{padding:0 18px 16px;}
  .subGroup{margin-top:10px;}
  .subGroup h4{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 8px;padding-top:10px;border-top:1px solid var(--border);}
  .subGroup:first-child h4{border-top:none;padding-top:0;}

  .dishRow{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:8px;}
  .dishRow:hover{background:var(--cream);}
  .dishRow.dimmed{display:none;}
  .dishThumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#f1efe9;flex-shrink:0;border:1px solid var(--border);}
  .dishThumb.empty{display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);text-align:center;}
  .dishInfo{flex:1;min-width:0;}
  .dishInfo .name{font-weight:700;font-size:14.5px;}
  .dishInfo .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dishActions{display:flex;gap:6px;flex-shrink:0;}
  .miniBtn{padding:6px 12px;border-radius:14px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;color:var(--navy);}
  .miniBtn.danger{color:var(--danger);border-color:#f0d0cc;}
  .addRowBtn{margin-top:10px;padding:8px 14px;border-radius:16px;border:1px dashed var(--navy);background:transparent;color:var(--navy);font-size:13px;font-weight:600;}

  /* ---------- Drawer ---------- */
  #overlay{position:fixed;inset:0;background:rgba(11,32,48,.45);z-index:80;display:none;}
  #overlay.show{display:block;}
  #drawer{position:fixed;top:0;right:0;height:100%;width:460px;max-width:94vw;background:#fff;z-index:90;box-shadow:-8px 0 30px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;}
  #drawer.show{transform:translateX(0);}
  #drawerHead{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  #drawerHead h2{font-size:19px;}
  #drawerClose{background:none;border:none;font-size:22px;color:var(--muted);line-height:1;}
  #drawerBody{padding:18px 20px;overflow-y:auto;flex:1;}
  #drawerFoot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:5px;}
  .field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;}
  .field textarea{min-height:56px;resize:vertical;}
  .drawerLangs{display:flex;gap:4px;margin-bottom:16px;}
  .allergenGrid{display:flex;flex-wrap:wrap;gap:6px;}
  .allergenChip{padding:6px 11px;border-radius:14px;border:1px solid var(--border);font-size:12.5px;background:#fff;color:var(--text);}
  .allergenChip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .photoPreview{width:100%;height:140px;border-radius:8px;object-fit:cover;background:#f1efe9;margin-bottom:8px;display:none;}
  .photoPreview.show{display:block;}
  .checkRow{display:flex;align-items:center;gap:8px;font-size:13.5px;}
  .btnPrimary{flex:1;padding:11px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:14px;}
  .btnGhost{padding:11px 16px;background:#fff;border:1px solid var(--border);border-radius:8px;font-weight:600;font-size:14px;color:var(--text);}

  /* ---------- Categorie tab ---------- */
  .catCard{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;}
  .catCardHead{display:flex;align-items:center;gap:8px;}
  .catCardHead input{flex:1;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-weight:700;color:var(--navy);}
  .arrowBtn{padding:6px 9px;border-radius:6px;border:1px solid var(--border);background:#fff;}
  .subRow{display:flex;align-items:center;gap:8px;margin-top:8px;padding-left:14px;}
  .subRow input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;}
  .subKey{font-size:11px;color:var(--muted);margin-top:4px;}

  /* ---------- Info tab ---------- */
  .infoCard{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
  .infoCard h3{margin-bottom:12px;}
  .rowFields{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .rowFields .field{flex:1;min-width:140px;}

  /* ---------- Toast ---------- */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:24px;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .25s ease;z-index:200;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:820px){
    #piattiLayout{grid-template-columns:1fr;}
    #catNav{position:static;max-height:none;}
    #drawer{width:100vw;max-width:100vw;}
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div id="loginBox">
    <h1>Gustavo</h1>
    <p>Accedi per gestire il menu</p>
    <input id="loginEmail" type="text" placeholder="Email" autocomplete="username">
    <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Accedi</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="topbar">
    <div id="topbar-inner">
      <div id="brand">Gustavo <span>· Gestione</span></div>
      <div id="tabs">
        <button class="tabbtn" data-tab="piatti">Piatti &amp; Drink</button>
        <button class="tabbtn" data-tab="categorie">Categorie</button>
        <button class="tabbtn" data-tab="info">Info Locale</button>
      </div>
      <div id="searchWrap" class="hidden">
        <input id="searchInput" type="text" placeholder="Cerca un piatto...">
      </div>
      <div id="langs"></div>
      <div id="userInfo"><span id="userEmail"></span><button id="logoutBtn">Esci</button></div>
    </div>
  </div>
  <div id="main">
    <div id="tabPiatti"></div>
    <div id="tabCategorie" class="hidden"></div>
    <div id="tabInfo" class="hidden"></div>
  </div>
</div>

<div id="overlay"></div>
<div id="drawer">
  <div id="drawerHead"><h2 id="drawerTitle">Voce</h2><button id="drawerClose">&times;</button></div>
  <div id="drawerBody"></div>
  <div id="drawerFoot">
    <button class="btnPrimary" id="drawerSave">Salva</button>
    <button class="btnGhost" id="drawerCancel">Annulla</button>
  </div>
</div>
<div id="toast"></div>

<script>
const SUPABASE_URL = "https://eirqridakadiwxzfctih.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpcnFyaWRha2FkaXd4emZjdGloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4Njg1MzUsImV4cCI6MjA5OTQ0NDUzNX0.m403t9H_kfEcra5Xep8iurQ5QuFMv1vfA-s3o8dEsSA";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const LANGS = [
  {key:'it', label:'IT'}, {key:'en', label:'EN'}, {key:'es', label:'ES'},
  {key:'de', label:'DE'}, {key:'fr', label:'FR'}
];
const ALLERGENS = [
  {key:'gluten', label:'Glutine'}, {key:'lattosio', label:'Latte/Lattosio'},
  {key:'frutta a guscio', label:'Frutta a guscio'}, {key:'uova', label:'Uova'},
  {key:'pesce', label:'Pesce'}, {key:'crostacei', label:'Crostacei'},
  {key:'molluschi', label:'Molluschi'}, {key:'solfiti', label:'Solfiti'},
  {key:'arachidi', label:'Arachidi'}, {key:'soia', label:'Soia'},
  {key:'sedano', label:'Sedano'}, {key:'senape', label:'Senape'},
  {key:'sesamo', label:'Sesamo'}, {key:'lupini', label:'Lupini'}
];

let state = {
  lang: 'it', tab: 'piatti', search: '',
  categories: [], subcategories: [], items: [], venue: null, banners: [],
  drawerMode: null, drawerData: null, pendingPhotoFile: null
};

function t(jsonb, lang){ if(!jsonb) return ''; return jsonb[lang||state.lang] || jsonb['it'] || Object.values(jsonb)[0] || ''; }
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>el.classList.remove('show'), 2200);
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------------- AUTH ---------------- */
async function initAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ showApp(session); } else { showLogin(); }
}
function showLogin(){
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}
async function showApp(session){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userEmail').textContent = session.user.email;
  renderLangs();
  await loadAll();
  switchTab('piatti');
}
document.getElementById('loginBtn').onclick = async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(error){ errEl.textContent = 'Accesso non riuscito. Controlla email e password.'; return; }
  showApp(data.session);
};
document.getElementById('logoutBtn').onclick = async ()=>{
  await sb.auth.signOut();
  location.reload();
};

/* ---------------- DATA LOAD ---------------- */
async function loadAll(){
  const [c, s, m, v, b] = await Promise.all([
    sb.from('categories').select('*').order('sort_order'),
    sb.from('subcategories').select('*').order('sort_order'),
    sb.from('menu_items').select('*').order('sort_order'),
    sb.from('venue_info').select('*').eq('id',1).maybeSingle(),
    sb.from('banners').select('*').order('sort_order')
  ]);
  state.categories = c.data || [];
  state.subcategories = s.data || [];
  state.items = m.data || [];
  state.venue = v.data;
  state.banners = b.data || [];
}

/* ---------------- TOP NAV ---------------- */
function renderLangs(){
  const el = document.getElementById('langs');
  el.innerHTML = LANGS.map(l=>`<button class="langbtn ${l.key===state.lang?'active':''}" data-lang="${l.key}">${l.label}</button>`).join('');
  el.querySelectorAll('.langbtn').forEach(b=> b.onclick = ()=>{ state.lang = b.dataset.lang; renderLangs(); renderCurrentTab(); });
}
document.querySelectorAll('.tabbtn').forEach(b=> b.onclick = ()=> switchTab(b.dataset.tab));
function switchTab(tab){
  state.tab = tab;
  document.querySelectorAll('.tabbtn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('tabPiatti').classList.toggle('hidden', tab!=='piatti');
  document.getElementById('tabCategorie').classList.toggle('hidden', tab!=='categorie');
  document.getElementById('tabInfo').classList.toggle('hidden', tab!=='info');
  document.getElementById('searchWrap').classList.toggle('hidden', tab!=='piatti');
  renderCurrentTab();
}
function renderCurrentTab(){
  if(state.tab==='piatti') renderPiatti();
  else if(state.tab==='categorie') renderCategorie();
  else renderInfo();
}
document.getElementById('searchInput').oninput = (e)=>{ state.search = e.target.value.trim().toLowerCase(); applySearchFilter(); };

/* ---------------- PIATTI TAB ---------------- */
function renderPiatti(){
  const root = document.getElementById('tabPiatti');
  const cats = state.categories;
  const nav = cats.map(c=>{
    const subs = state.subcategories.filter(s=>s.category_id===c.id);
    return `<a href="#cat-${c.id}">${esc(t(c.title))}</a>` +
      subs.map(s=>`<a class="subnavlink" href="#cat-${c.id}">${esc(t(s.title))}</a>`).join('');
  }).join('');

  const accs = cats.map(c=>{
    const subs = state.subcategories.filter(s=>s.category_id===c.id);
    const groups = subs.length ? subs : [{id:null, title:{it:''}}];
    const count = state.items.filter(i=>i.category_id===c.id).length;
    const body = groups.map(g=>{
      const rows = state.items
        .filter(i=> i.category_id===c.id && i.subcategory_id===g.id)
        .map(i=> dishRowHtml(i)).join('');
      return `<div class="subGroup" data-sub="${g.id||''}">
        ${g.id ? `<h4>${esc(t(g.title))}</h4>` : ''}
        ${rows || '<div style="font-size:13px;color:var(--muted);padding:4px 0;">Nessuna voce.</div>'}
        <button class="addRowBtn" data-cat="${c.id}" data-sub="${g.id||''}">+ Aggiungi voce</button>
      </div>`;
    }).join('');
    return `<details class="catAcc" id="cat-${c.id}" open>
      <summary><span>${esc(t(c.title))}</span><span class="count">${count} voci</span></summary>
      <div class="catBody">${body}</div>
    </details>`;
  }).join('');

  root.innerHTML = `<div id="piattiLayout"><nav id="catNav">${nav}</nav><div id="catAccWrap">${accs}</div></div>`;

  root.querySelectorAll('.miniBtn.edit').forEach(b=> b.onclick = ()=> openDrawer('edit', b.dataset.id));
  root.querySelectorAll('.miniBtn.danger').forEach(b=> b.onclick = ()=> deleteItem(b.dataset.id));
  root.querySelectorAll('.addRowBtn').forEach(b=> b.onclick = ()=> openDrawer('new', null, {category_id:b.dataset.cat, subcategory_id:b.dataset.sub||null}));
  applySearchFilter();
}
function dishRowHtml(i){
  const photo = i.photo_url ? `<img class="dishThumb" src="${i.photo_url}">` : `<div class="dishThumb empty">no foto</div>`;
  const meta = [i.price, (i.allergens||[]).join(', ')].filter(Boolean).join(' · ');
  return `<div class="dishRow" data-name="${esc(t(i.name)).toLowerCase()}">
    ${photo}
    <div class="dishInfo">
      <div class="name">${esc(t(i.name))}${i.recommended?' ★':''}</div>
      <div class="meta">${esc(meta)}</div>
    </div>
    <div class="dishActions">
      <button class="miniBtn edit" data-id="${i.id}">Modifica</button>
      <button class="miniBtn danger" data-id="${i.id}">Elimina</button>
    </div>
  </div>`;
}
function applySearchFilter(){
  const q = state.search;
  document.querySelectorAll('.dishRow').forEach(r=>{
    r.classList.toggle('dimmed', q && !r.dataset.name.includes(q));
  });
  document.querySelectorAll('details.catAcc').forEach(d=>{
    if(!q){ return; }
    const anyVisible = Array.from(d.querySelectorAll('.dishRow')).some(r=>!r.classList.contains('dimmed'));
    d.open = anyVisible;
  });
}
async function deleteItem(id){
  if(!confirm('Eliminare questa voce?')) return;
  const { error } = await sb.from('menu_items').delete().eq('id', id);
  if(error){ toast('Errore: ' + error.message); return; }
  state.items = state.items.filter(i=>i.id!==id);
  renderPiatti();
  toast('Voce eliminata');
}

/* ---------------- DRAWER (add/edit dish) ---------------- */
function openDrawer(mode, id, presetIds){
  state.drawerMode = mode; state.pendingPhotoFile = null;
  const item = mode==='edit' ? state.items.find(i=>i.id===id) : {
    id:null, category_id:presetIds.category_id, subcategory_id:presetIds.subcategory_id,
    name:{}, ingredients:{}, group_label:{}, price:'', allergens:[], recommended:false, photo_url:null, sort_order:0
  };
  state.drawerData = JSON.parse(JSON.stringify(item));
  document.getElementById('drawerTitle').textContent = mode==='edit' ? 'Modifica voce' : 'Nuova voce';
  renderDrawerBody();
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
}
document.getElementById('drawerClose').onclick = closeDrawer;
document.getElementById('drawerCancel').onclick = closeDrawer;
document.getElementById('overlay').onclick = closeDrawer;

function renderDrawerBody(){
  const d = state.drawerData;
  const body = document.getElementById('drawerBody');
  const langTabs = LANGS.map(l=>`<button class="langbtn ${l.key===state.lang?'active':''}" data-dlang="${l.key}">${l.label}</button>`).join('');
  const allergenChips = ALLERGENS.map(a=>{
    const on = (d.allergens||[]).includes(a.key);
    return `<button type="button" class="allergenChip ${on?'on':''}" data-allergen="${esc(a.key)}">${esc(a.label)}</button>`;
  }).join('');
  body.innerHTML = `
    <div class="drawerLangs">${langTabs}</div>
    <img id="photoPreview" class="photoPreview ${d.photo_url?'show':''}" src="${d.photo_url||''}">
    <div class="field"><label>Nome (${state.lang.toUpperCase()})</label><input type="text" id="f_name" value="${esc(t(d.name))}"></div>
    <div class="field"><label>Ingredienti (${state.lang.toUpperCase()})</label><textarea id="f_ing">${esc(t(d.ingredients))}</textarea></div>
    <div class="field"><label>Sotto-gruppo (opzionale, es. "Rossi · Canari")</label><input type="text" id="f_group" value="${esc(t(d.group_label))}"></div>
    <div class="rowFields">
      <div class="field"><label>Prezzo</label><input type="text" id="f_price" value="${esc(d.price||'')}"></div>
      <div class="field checkRow" style="align-self:center;"><input type="checkbox" id="f_rec" ${d.recommended?'checked':''}><label style="margin:0;text-transform:none;font-weight:500;">Consigliato</label></div>
    </div>
    <div class="field"><label>Allergeni</label><div class="allergenGrid">${allergenChips}</div></div>
    <div class="field"><label>Foto piatto</label><input type="file" id="f_photo" accept="image/*"></div>
  `;
  body.querySelectorAll('[data-dlang]').forEach(b=> b.onclick = ()=>{
    saveDrawerFieldsToModel();
    state.lang = b.dataset.dlang;
    renderLangs();
    renderDrawerBody();
  });
  body.querySelectorAll('.allergenChip').forEach(b=> b.onclick = ()=>{
    const key = b.dataset.allergen;
    d.allergens = d.allergens || [];
    const idx = d.allergens.indexOf(key);
    if(idx>=0) d.allergens.splice(idx,1); else d.allergens.push(key);
    b.classList.toggle('on');
  });
  document.getElementById('f_photo').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    state.pendingPhotoFile = file;
    const url = URL.createObjectURL(file);
    const pv = document.getElementById('photoPreview');
    pv.src = url; pv.classList.add('show');
  };
}
function saveDrawerFieldsToModel(){
  const d = state.drawerData;
  d.name = d.name || {}; d.ingredients = d.ingredients || {}; d.group_label = d.group_label || {};
  d.name[state.lang] = document.getElementById('f_name').value;
  d.ingredients[state.lang] = document.getElementById('f_ing').value;
  d.group_label[state.lang] = document.getElementById('f_group').value;
  d.price = document.getElementById('f_price').value;
  d.recommended = document.getElementById('f_rec').checked;
}
document.getElementById('drawerSave').onclick = async ()=>{
  saveDrawerFieldsToModel();
  const d = state.drawerData;
  let photo_url = d.photo_url;
  if(state.pendingPhotoFile){
    const file = state.pendingPhotoFile;
    const path = `dish_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9_.-]/g,'_')}`;
    const { error: upErr } = await sb.storage.from('menu-photos').upload(path, file, { upsert:true });
    if(upErr){ toast('Errore upload foto: ' + upErr.message); return; }
    const { data: pub } = sb.storage.from('menu-photos').getPublicUrl(path);
    photo_url = pub.publicUrl;
  }
  const payload = {
    category_id: d.category_id, subcategory_id: d.subcategory_id || null,
    name: d.name, ingredients: d.ingredients, group_label: d.group_label,
    price: d.price, allergens: d.allergens || [], recommended: !!d.recommended,
    photo_url, sort_order: d.sort_order || 0
  };
  let error;
  if(state.drawerMode==='edit'){
    ({ error } = await sb.from('menu_items').update(payload).eq('id', d.id));
  } else {
    ({ error } = await sb.from('menu_items').insert(payload));
  }
  if(error){ toast('Errore: ' + error.message); return; }
  await loadAll();
  renderPiatti();
  closeDrawer();
  toast('Salvato');
};

/* ---------------- CATEGORIE TAB ---------------- */
function renderCategorie(){
  const root = document.getElementById('tabCategorie');
  const cats = state.categories;
  root.innerHTML = cats.map((c,idx)=>{
    const subs = state.subcategories.filter(s=>s.category_id===c.id);
    return `<div class="catCard" data-cat="${c.id}">
      <div class="catCardHead">
        <button class="arrowBtn" data-act="catUp" data-id="${c.id}" ${idx===0?'disabled':''}>↑</button>
        <button class="arrowBtn" data-act="catDown" data-id="${c.id}" ${idx===cats.length-1?'disabled':''}>↓</button>
        <input type="text" data-field="catTitle" data-id="${c.id}" value="${esc(t(c.title))}">
        <button class="miniBtn" data-act="catSave" data-id="${c.id}">Salva</button>
        <button class="miniBtn danger" data-act="catDel" data-id="${c.id}">Elimina categoria</button>
      </div>
      <div class="subKey">Chiave interna: ${esc(c.key)}</div>
      ${subs.map((s,si)=>`
        <div class="subRow" data-sub="${s.id}">
          <button class="arrowBtn" data-act="subUp" data-id="${s.id}" ${si===0?'disabled':''}>↑</button>
          <button class="arrowBtn" data-act="subDown" data-id="${s.id}" ${si===subs.length-1?'disabled':''}>↓</button>
          <input type="text" data-field="subTitle" data-id="${s.id}" value="${esc(t(s.title))}">
          <button class="miniBtn" data-act="subSave" data-id="${s.id}">Salva</button>
          <button class="miniBtn danger" data-act="subDel" data-id="${s.id}">Elimina</button>
        </div>`).join('')}
      <button class="addRowBtn" data-act="subNew" data-id="${c.id}">+ Nuova sottocategoria</button>
    </div>`;
  }).join('') + `<button class="addRowBtn" data-act="catNew">+ Nuova categoria</button>`;

  root.querySelectorAll('[data-act]').forEach(b=> b.onclick = ()=> handleCatAction(b.dataset.act, b.dataset.id));
}
async function handleCatAction(act, id){
  const root = document.getElementById('tabCategorie');
  if(act==='catSave'){
    const val = root.querySelector(`input[data-field="catTitle"][data-id="${id}"]`).value;
    const c = state.categories.find(x=>x.id===id);
    c.title = c.title||{}; c.title[state.lang] = val;
    const { error } = await sb.from('categories').update({title:c.title}).eq('id', id);
    toast(error ? 'Errore' : 'Categoria salvata');
  } else if(act==='subSave'){
    const val = root.querySelector(`input[data-field="subTitle"][data-id="${id}"]`).value;
    const s = state.subcategories.find(x=>x.id===id);
    s.title = s.title||{}; s.title[state.lang] = val;
    const { error } = await sb.from('subcategories').update({title:s.title}).eq('id', id);
    toast(error ? 'Errore' : 'Sottocategoria salvata');
  } else if(act==='catDel'){
    if(!confirm('Eliminare la categoria e tutte le sue voci/sottocategorie?')) return;
    await sb.from('categories').delete().eq('id', id);
    await loadAll(); renderCategorie(); toast('Categoria eliminata');
  } else if(act==='subDel'){
    if(!confirm('Eliminare la sottocategoria?')) return;
    await sb.from('subcategories').delete().eq('id', id);
    await loadAll(); renderCategorie(); toast('Sottocategoria eliminata');
  } else if(act==='subNew'){
    const title = prompt('Nome nuova sottocategoria (IT):');
    if(!title) return;
    const subs = state.subcategories.filter(s=>s.category_id===id);
    await sb.from('subcategories').insert({category_id:id, key:title, title:{it:title}, sort_order:subs.length});
    await loadAll(); renderCategorie(); toast('Sottocategoria creata');
  } else if(act==='catNew'){
    const title = prompt('Nome nuova categoria (IT):');
    if(!title) return;
    await sb.from('categories').insert({key:title, title:{it:title}, sort_order:state.categories.length});
    await loadAll(); renderCategorie(); toast('Categoria creata');
  } else if(act==='catUp' || act==='catDown'){
    await swapOrder('categories', state.categories, id, act==='catUp'?-1:1);
    await loadAll(); renderCategorie();
  } else if(act==='subUp' || act==='subDown'){
    const s = state.subcategories.find(x=>x.id===id);
    const siblings = state.subcategories.filter(x=>x.category_id===s.category_id);
    await swapOrder('subcategories', siblings, id, act==='subUp'?-1:1);
    await loadAll(); renderCategorie();
  }
}
async function swapOrder(table, list, id, dir){
  const idx = list.findIndex(x=>x.id===id);
  const swapIdx = idx + dir;
  if(swapIdx<0 || swapIdx>=list.length) return;
  const a = list[idx], b = list[swapIdx];
  const ao = a.sort_order, bo = b.sort_order;
  await sb.from(table).update({sort_order: bo}).eq('id', a.id);
  await sb.from(table).update({sort_order: ao}).eq('id', b.id);
}

/* ---------------- INFO TAB ---------------- */
function renderInfo(){
  const v = state.venue || {};
  const root = document.getElementById('tabInfo');
  root.innerHTML = `
    <div class="infoCard">
      <h3>Contatti</h3>
      <div class="field"><label>Indirizzo (${state.lang.toUpperCase()})</label><input type="text" id="v_addr" value="${esc(t(v.address))}"></div>
      <div class="field"><label>Orari (${state.lang.toUpperCase()})</label><input type="text" id="v_hours" value="${esc(t(v.hours))}"></div>
      <div class="field"><label>Telefono / contatto (${state.lang.toUpperCase()})</label><input type="text" id="v_phone" value="${esc(t(v.phone))}"></div>
      <button class="miniBtn" id="v_save_contact">Salva</button>
    </div>
    <div class="infoCard">
      <h3>"La Nostra Storia"</h3>
      <div class="field"><label>Titolo (${state.lang.toUpperCase()})</label><input type="text" id="v_storia_title" value="${esc(t(v.storia_title))}"></div>
      <div class="field"><label>Testo (${state.lang.toUpperCase()})</label><textarea id="v_storia_text">${esc(t(v.storia_text))}</textarea></div>
      <div class="checkRow" style="margin-bottom:12px;"><input type="checkbox" id="v_storia_visible" ${v.storia_visible?'checked':''}><label style="margin:0;">Visibile in home</label></div>
      <button class="miniBtn" id="v_save_storia">Salva</button>
    </div>
    <div class="infoCard">
      <h3>Banner personalizzati</h3>
      <p style="font-size:13px;color:var(--muted);">Messaggi brevi mostrati in home (es. coperto, avvisi, promozioni).</p>
      <div id="bannerList"></div>
      <button class="addRowBtn" id="v_new_banner">+ Nuovo banner</button>
    </div>
  `;
  document.getElementById('v_save_contact').onclick = async ()=>{
    const address = v.address||{}, hours = v.hours||{}, phone = v.phone||{};
    address[state.lang] = document.getElementById('v_addr').value;
    hours[state.lang] = document.getElementById('v_hours').value;
    phone[state.lang] = document.getElementById('v_phone').value;
    const { error } = await sb.from('venue_info').update({address,hours,phone}).eq('id',1);
    toast(error?'Errore':'Contatti salvati');
    if(!error){ v.address=address; v.hours=hours; v.phone=phone; }
  };
  document.getElementById('v_save_storia').onclick = async ()=>{
    const storia_title = v.storia_title||{}, storia_text = v.storia_text||{};
    storia_title[state.lang] = document.getElementById('v_storia_title').value;
    storia_text[state.lang] = document.getElementById('v_storia_text').value;
    const storia_visible = document.getElementById('v_storia_visible').checked;
    const { error } = await sb.from('venue_info').update({storia_title,storia_text,storia_visible}).eq('id',1);
    toast(error?'Errore':'Storia salvata');
    if(!error){ v.storia_title=storia_title; v.storia_text=storia_text; v.storia_visible=storia_visible; }
  };
  renderBanners();
  document.getElementById('v_new_banner').onclick = async ()=>{
    await sb.from('banners').insert({text:{it:'Nuovo banner'}, active:true, sort_order: state.banners.length});
    await loadAll(); renderInfo(); toast('Banner creato');
  };
}
function renderBanners(){
  const list = document.getElementById('bannerList');
  list.innerHTML = state.banners.map(b=>`
    <div class="subRow" data-banner="${b.id}">
      <input type="text" data-bfield="text" data-id="${b.id}" value="${esc(t(b.text))}">
      <label class="checkRow" style="white-space:nowrap;"><input type="checkbox" data-bfield="active" data-id="${b.id}" ${b.active?'checked':''}> Attivo</label>
      <button class="miniBtn" data-bact="save" data-id="${b.id}">Salva</button>
      <button class="miniBtn danger" data-bact="del" data-id="${b.id}">Elimina</button>
    </div>`).join('') || '<p style="font-size:13px;color:var(--muted);">Nessun banner.</p>';
  list.querySelectorAll('[data-bact]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      if(btn.dataset.bact==='del'){
        if(!confirm('Eliminare il banner?')) return;
        await sb.from('banners').delete().eq('id', id);
      } else {
        const b = state.banners.find(x=>x.id===id);
        const textVal = list.querySelector(`input[data-bfield="text"][data-id="${id}"]`).value;
        const activeVal = list.querySelector(`input[data-bfield="active"][data-id="${id}"]`).checked;
        b.text = b.text||{}; b.text[state.lang] = textVal;
        await sb.from('banners').update({text:b.text, active:activeVal}).eq('id', id);
      }
      await loadAll(); renderInfo(); toast('Fatto');
    };
  });
}

initAuth();
</script>
